<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>个人日历 · Windows 交互原型</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="weather-motion.css">
  <link rel="stylesheet" href="capture.css">
  <script defer src="data/lunar-days.js"></script>
  <script defer src="model.js"></script>
  <script defer src="icons.js"></script>
  <script defer src="views.js"></script>
  <script defer src="preferences.js"></script>
  <script defer src="desktop-preview.js"></script>
  <script defer src="reminders.js"></script>
  <script defer src="capture.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="workspace">
    <aside class="rail" aria-label="原型导航">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" width="42" height="42"><defs><linearGradient id="brandBody" x1="128" y1="32" x2="128" y2="232" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="68%" stop-color="#F5F9FE"/><stop offset="100%" stop-color="#E3EFFB"/></linearGradient><linearGradient id="brandHead" x1="28" y1="32" x2="228" y2="94" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0052A3"/><stop offset="55%" stop-color="#0B75D1"/><stop offset="100%" stop-color="#1A98F0"/></linearGradient><linearGradient id="brandSun" x1="138" y1="112" x2="176" y2="156" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#FFF099"/><stop offset="48%" stop-color="#FFC233"/><stop offset="100%" stop-color="#F27D0C"/></linearGradient><linearGradient id="brandGlass" x1="68" y1="136" x2="172" y2="202" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#FFFFFF" stop-opacity=".93"/><stop offset="100%" stop-color="#CAE5FB" stop-opacity=".86"/></linearGradient><clipPath id="brandClip"><rect x="26" y="32" width="204" height="200" rx="42"/></clipPath></defs><rect x="26" y="32" width="204" height="200" rx="42" fill="url(#brandBody)"/><g clip-path="url(#brandClip)"><rect x="26" y="32" width="204" height="58" fill="url(#brandHead)"/><circle cx="82" cy="52" r="10.5" fill="#00356B" fill-opacity=".5"/><circle cx="174" cy="52" r="10.5" fill="#00356B" fill-opacity=".5"/></g><rect x="26.8" y="32.8" width="202.4" height="198.4" rx="41.2" stroke="#9AC1E5" stroke-width="1.6"/><rect x="74" y="16" width="16" height="39" rx="8" fill="#EEF6FE" stroke="#7EAAD4" stroke-width="1.4"/><rect x="166" y="16" width="16" height="39" rx="8" fill="#EEF6FE" stroke="#7EAAD4" stroke-width="1.4"/><g stroke="#0C7AD8" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M51 128V116a10 10 0 0 1 10-10h12m110 0h12a10 10 0 0 1 10 10v12M51 190v12a10 10 0 0 0 10 10h12m110 0h12a10 10 0 0 0 10-10v-12"/></g><circle cx="155" cy="139" r="23.5" fill="url(#brandSun)" stroke="#FFF6BF" stroke-width="1.4"/><rect x="69" y="140" width="102" height="58" rx="16" fill="url(#brandGlass)" stroke="#FFFFFF" stroke-width="1.8"/><rect x="85" y="156.5" width="66" height="9.5" rx="4.75" fill="#0B75D1"/><rect x="85" y="173.5" width="44" height="8.5" rx="4.25" fill="#5D9BE0" fill-opacity=".82"/></svg></div><div><h1>个人日历</h1><p>Windows 交互原型</p></div></div>
      <nav class="nav" id="navigation" aria-label="界面导航"></nav>
      <div class="environment">
        <h2>演示环境</h2>
        <label for="theme">外观<select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
        <label for="clock-width">时钟宽度<select id="clock-width"><option value="normal">标准</option><option value="narrow">窄</option></select></label>
        <label for="network">天气状态<select id="network"><option value="online">在线样例</option><option value="cached">离线有缓存</option><option value="empty">离线无缓存</option></select></label>
        <button class="reset" id="reset-demo" type="button">重置演示</button>
      </div>
    </aside>
    <main class="desk" id="desktop" aria-label="模拟 Windows 桌面">
      <header class="desk-caption"><span class="caption-monitor" aria-hidden="true"></span><span>桌面预览</span><span class="caption-divider"></span><time datetime="2026-11-26">2026 / 11 / 26</time></header>
      <button type="button" class="mobile-environment secondary" data-action="environment">演示环境</button>
      <label class="mobile-nav">界面<select id="mobile-page" aria-label="选择原型界面"></select></label>
      <div class="wall" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div id="window-host" class="window-host"></div>
      <footer class="taskbar" aria-label="模拟任务栏">
        <div class="taskbar-apps" aria-hidden="true"></div>
        <div class="tray"><button type="button" id="optional-tray" class="icon-button" hidden aria-label="日历托盘图标"></button><span class="tray-symbols" aria-hidden="true"></span><button type="button" id="tray-clock" aria-label="任务栏时钟，打开或收起月历" aria-expanded="true"><span id="tray-line1"></span><span id="tray-line2"></span></button><span class="tray-bell" aria-hidden="true"></span></div>
      </footer>
    </main>
  </div>
  <dialog id="modal"></dialog>
  <div id="date-reminder-menu" class="date-reminder-menu" role="menu" aria-label="日期操作" hidden></div>
  <aside id="date-reminder-popup" class="date-reminder-popup" aria-label="日期提醒" hidden>
    <h2>日期提醒</h2>
    <div class="notice-entries" role="status"></div>
    <button type="button" class="secondary">知道了</button>
  </aside>
  <div id="announce" class="toast" role="status" aria-live="polite"></div>
  <noscript>启用 JavaScript 即可操作本地日历原型。</noscript>
</body>
</html>
