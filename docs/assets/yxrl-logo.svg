<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <filter id="cardShadow" x="-16%" y="-14%" width="132%" height="136%">
      <feDropShadow dx="0" dy="6" stdDeviation="6.5" flood-color="#0A233D" flood-opacity="0.22"/>
    </filter>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#0B3B6B" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="cardBodyGrad" x1="128" y1="32" x2="128" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#F5F9FE"/>
      <stop offset="100%" stop-color="#E3EFFB"/>
    </linearGradient>
    <linearGradient id="cardBorderGrad" x1="36" y1="32" x2="220" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D7E8F9"/>
      <stop offset="100%" stop-color="#9AC1E5"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="28" y1="32" x2="228" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052A3"/>
      <stop offset="55%" stop-color="#0B75D1"/>
      <stop offset="100%" stop-color="#1A98F0"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0" y1="16" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#DCEAF7"/>
      <stop offset="100%" stop-color="#9BBBD9"/>
    </linearGradient>
    <linearGradient id="bracketGrad" x1="50" y1="106" x2="206" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#005FB8"/>
      <stop offset="100%" stop-color="#1893EE"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFCA4B" stop-opacity="0.52"/>
      <stop offset="55%" stop-color="#FFB02E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFB02E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunGrad" x1="138" y1="112" x2="176" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF099"/>
      <stop offset="48%" stop-color="#FFC233"/>
      <stop offset="100%" stop-color="#F27D0C"/>
    </linearGradient>
    <linearGradient id="glassCardGrad" x1="68" y1="136" x2="172" y2="202" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.93"/>
      <stop offset="100%" stop-color="#CAE5FB" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="barPrimaryGrad" x1="84" y1="156" x2="148" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#005FB8"/>
      <stop offset="100%" stop-color="#1A94EE"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="26" y1="32" x2="190" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="26" y="32" width="204" height="200" rx="42"/>
    </clipPath>
  </defs>

  <!-- Calendar Card Base -->
  <g filter="url(#cardShadow)">
    <rect x="26" y="32" width="204" height="200" rx="42" fill="url(#cardBodyGrad)"/>
    <g clip-path="url(#cardClip)">
      <!-- Top Cobalt Calendar Header -->
      <rect x="26" y="32" width="204" height="58" fill="url(#headerGrad)"/>
      <rect x="26" y="88.5" width="204" height="2" fill="#00448A" fill-opacity="0.22"/>
      <!-- Binding Ring Sockets -->
      <circle cx="82" cy="52" r="10.5" fill="#00356B" fill-opacity="0.52"/>
      <circle cx="174" cy="52" r="10.5" fill="#00356B" fill-opacity="0.52"/>
      <!-- Diagonal Frosted Glass Sheen -->
      <path d="M26 32 H164 L92 232 H26 Z" fill="url(#sheenGrad)"/>
    </g>
    <rect x="26.75" y="32.75" width="202.5" height="198.5" rx="41.25" stroke="url(#cardBorderGrad)" stroke-width="1.5"/>
  </g>

  <!-- Calendar Binding Pins -->
  <rect x="74" y="16" width="16" height="39" rx="8" fill="url(#pinGrad)" stroke="#7EAAD4" stroke-width="1.4"/>
  <rect x="166" y="16" width="16" height="39" rx="8" fill="url(#pinGrad)" stroke="#7EAAD4" stroke-width="1.4"/>

  <!-- Four Corner Capture / OCR Viewfinder Brackets -->
  <g stroke="url(#bracketGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M51 128 V116 A10 10 0 0 1 61 106 H73"/>
    <path d="M183 106 H195 A10 10 0 0 1 205 116 V128"/>
    <path d="M51 190 V202 A10 10 0 0 0 61 212 H73"/>
    <path d="M183 212 H195 A10 10 0 0 0 205 202 V190"/>
  </g>

  <!-- Dynamic Weather Solar Sphere -->
  <circle cx="155" cy="139" r="36" fill="url(#sunGlow)"/>
  <circle cx="155" cy="139" r="23.5" fill="url(#sunGrad)" stroke="#FFF6BF" stroke-width="1.4"/>

  <!-- Frosted Glass Schedule / OCR Accent Card -->
  <g filter="url(#glassShadow)">
    <rect x="69" y="140" width="102" height="58" rx="16" fill="url(#glassCardGrad)" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="1.8"/>
    <rect x="85" y="156.5" width="66" height="9.5" rx="4.75" fill="url(#barPrimaryGrad)"/>
    <rect x="85" y="173.5" width="44" height="8.5" rx="4.25" fill="#5D9BE0" fill-opacity="0.82"/>
  </g>
</svg>
